[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "midnight-propulsion-lab"
version = "0.1.0"
description = "Reproducible, low-fidelity propulsion-architecture screening study."
requires-python = ">=3.12"
dependencies = ["numpy==2.2.6", "scipy==1.15.2", "matplotlib==3.10.7", "streamlit==1.50.0", "pandas>=2.2,<3", "PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9"]

[project.scripts]
midnight-propulsion = "midnight_propulsion_lab.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
